<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let month = "June";

        switch (month) {
            case "December":
            case "January":
            case "February":
                console.log("Winter Season");
                break;

            case "March":
            case "April":
            case "May":
                console.log("Summer Season");
                break;

            case "June":
            case "July":
            case "August":
            case "September":
                console.log("Rainy Season");
                break;

            case "October":
            case "November":
                console.log("Autumn Season");
                break;

            default:
                console.log("Invalid Month");
        }
    </script>
    <script>
        let monthNumber = 2;

switch (monthNumber) {
    case 1:
        console.log("January");
        break;
    case 2:
        console.log("February");
        break;
    case 3:
        console.log("March");
        break;
    case 4:
        console.log("April");
        break;
    case 5:
        console.log("May");
        break;
    case 6:
        console.log("June");
        break;
    case 7:
        console.log("July");
        break;
    case 8:
        console.log("August");
        break;
    case 9:
        console.log("September");
        break;
    case 10:
        console.log("October");
        break;
    case 11:
        console.log("November");
        break;
    case 12:
        console.log("December");
        break;
    default:
        console.log("Invalid Month Number");
}
    </script>
</body>

</html>
